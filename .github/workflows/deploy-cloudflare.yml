name: Deploy Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: production-cloudflare
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Ensure Quran KV
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          namespaces=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api?per_page=100")
          id=$(jq -r '.result[] | select(.title == "islam-menjawab-quran") | .id' <<<"$namespaces" | head -1)
          if [ -z "$id" ]; then
            id=$(curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data '{"title":"islam-menjawab-quran"}' "$api" | jq -er '.result.id')
          fi
          sed -i "s/REPLACE_WITH_KV_NAMESPACE_ID/$id/" wrangler.toml
          printf 'KV_ID=%s\n' "$id" >> "$GITHUB_ENV"
      - name: Upload Quran dataset
        run: npx wrangler kv key put --namespace-id "$KV_ID" --remote dataset --path quran.json
      - name: Ensure Pages project
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          code=$(curl -sS -o /tmp/project.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/islam-menjawab")
          if [ "$code" = 404 ]; then
            curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data '{"name":"islam-menjawab","production_branch":"main"}' "$api" >/dev/null
          elif [ "$code" != 200 ]; then
            cat /tmp/project.json; exit 1
          fi
      - name: Deploy Pages and Worker
        run: npx wrangler pages deploy public --project-name=islam-menjawab --branch=main --commit-hash="$GITHUB_SHA"
